<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nota+</title>
<meta name="description" content="Free AI notes. Live Arabic and English transcripts, summaries, action items and translation.">
<meta name="theme-color" content="#0B6B63">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nota+">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app"></div>
<div id="print" aria-hidden="true"></div>
<div id="modal" hidden></div>
<div id="wait" hidden><div class="box"><span class="spin"></span><span class="msg"></span></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file" accept="audio/*,video/mp4,video/webm,.m4a,.mp3,.wav,.ogg,.webm,.mp4" hidden>
<noscript>Nota+ needs JavaScript.</noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
