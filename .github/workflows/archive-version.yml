name: Keep the previous version
# Whenever docs/version.js changes on the live branch, save the version that was just replaced into
# docs/previous/ so the Back button at the top of the page can always return to it.
on:
  push:
    branches: [claude/gracious-mayer-ywmspl]
    paths: ["docs/version.js"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (commit or tag) of a version to archive by hand"
        required: true
permissions:
  contents: write
jobs:
  archive:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Archive the version that was replaced
        run: |
          REF="${{ github.event.inputs.ref || github.event.before }}"
          if [ -z "$REF" ] || [ "$REF" = "0000000000000000000000000000000000000000" ]; then echo "Nothing before this push."; exit 0; fi
          node tools/archive-version.js "$REF"
      - name: Save it
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/previous docs/versions.json
          git diff --cached --quiet && { echo "No change."; exit 0; }
          git commit -m "Keep the previous version for the Back button"
          git push
